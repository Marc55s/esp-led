<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Quick Presets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-white">LED Palette Control</h1>
            <p class="text-slate-400">Apply a solid color to all 100 LEDs instantly.</p>
        </header>

        <div id="status" class="mb-6 inline-block px-4 py-2 rounded-lg text-sm font-mono bg-slate-900 border border-slate-700">
            System: <span class="text-indigo-400">Idle</span>
        </div>

        <div class="color-grid" id="presetContainer">
            </div>

        <div class="glass-card rounded-xl p-6 mt-12">
            <h3 class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-4">Last Sent Payload (Truncated for Preview)</h3>
            <pre id="debugOutput" class="text-[10px] text-cyan-400 bg-black/40 p-4 rounded-lg overflow-x-auto">{}</pre>
        </div>
    </div>

    <script>
        const LED_COUNT = 100;
        const TARGET_URL = '/led';

        // Preset Definitions: [Name, Hue (0-360), Sat (0-255), Val (0-255)]
        const presets = [
            ['Red', 0, 255, 150],
            ['Orange', 30, 255, 150],
            ['Yellow', 60, 255, 150],
            ['Green', 120, 255, 150],
            ['Cyan', 180, 255, 150],
            ['Blue', 240, 255, 150],
            ['Purple', 280, 255, 150],
            ['Pink', 330, 255, 150],
            ['White', 0, 0, 200],
            ['Warm', 35, 100, 180],
            ['Dim Red', 0, 255, 20],
            ['Off', 0, 0, 0]
        ];

        const container = document.getElementById('presetContainer');
        const statusEl = document.getElementById('status').querySelector('span');
        const debugEl = document.getElementById('debugOutput');

        function init() {
            presets.forEach(([name, h, s, v]) => {
                const btn = document.createElement('button');
                btn.className = "glass-card p-4 rounded-xl hover:scale-105 transition-all active:scale-95 text-center group";
                
                // Calculate CSS color for the icon
                const cssColor = `hsl(${h}, ${s/2.55}%, ${v === 0 ? 10 : 50}%)`;
                
                btn.innerHTML = `
                    <div class="w-12 h-12 rounded-full mx-auto mb-3 shadow-lg group-hover:shadow-glow transition-all" 
                         style="background-color: ${cssColor}; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 0 10px ${v > 0 ? cssColor : 'transparent'}"></div>
                    <span class="font-medium text-sm text-slate-300">${name}</span>
                `;

                btn.onclick = () => sendColor(h, s, v);
                container.appendChild(btn);
            });
        }

        async function sendColor(h, s, v) {
            // Build arrays of 100 elements each
            const payload = {
                offset: 0,
                h: new Array(LED_COUNT).fill(h),
                s: new Array(LED_COUNT).fill(s),
                v: new Array(LED_COUNT).fill(v)
            };

            // Update UI
            statusEl.textContent = "Transmitting...";
            statusEl.className = "text-yellow-400";
            
            // Show preview (truncated for readability)
            debugEl.textContent = JSON.stringify({
                offset: payload.offset,
                h: `Array(${payload.h.length}) [${payload.h[0]}, ...]`,
                s: `Array(${payload.s.length}) [${payload.s[0]}, ...]`,
                v: `Array(${payload.v.length}) [${payload.v[0]}, ...]`
            }, null, 4);

            try {
                const response = await fetch(TARGET_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    statusEl.textContent = "Success";
                    statusEl.className = "text-emerald-400";
                } else {
                    throw new Error(`Error: ${response.status}`);
                }
            } catch (err) {
                statusEl.textContent = "Failed";
                statusEl.className = "text-red-400";
                console.error(err);
            }

            // Return to idle after a moment
            setTimeout(() => {
                statusEl.textContent = "Idle";
                statusEl.className = "text-indigo-400";
            }, 2000);
        }

        init();
    </script>
</body>
</html>

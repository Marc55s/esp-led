<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESP Control Center</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #2c3e50; color: #ecf0f1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background-color: #34495e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center; width: 350px; }
        .status-indicator { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; font-size: 2em; border: 3px solid rgba(255,255,255,0.2); background-color: #95a5a6; transition: all 0.3s ease; }
        .online { background-color: #2ecc71; box-shadow: 0 0 20px #2ecc71; }
        .offline { background-color: #e74c3c; box-shadow: 0 0 20px #e74c3c; }
        input { padding: 10px; border-radius: 5px; border: none; width: 70%; margin-bottom: 15px; text-align: center; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .auto-check { margin-top: 15px; font-size: 0.8em; color: #bdc3c7; }
    </style>
</head>
<body>

    <div class="container">
        <h2>ESP is online</h2>
    </div>
</body>
</html>
